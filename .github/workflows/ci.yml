name: CI pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:

# cancel previous job if new push come
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Formatting checks
        run: uv run ruff format --check .
      - name: Linter and syntax checks
        run: uv run ruff check .
      - name: Type checking
        run: uv run mypy src/

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run unit tests
        run: uv run pytest --cov=src -m "not gpu and not integration"