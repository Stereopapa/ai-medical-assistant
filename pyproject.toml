[project]
name = "ai-medical-assistant"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "openai",
    "psutil",
    "pynvml>=13.0.1",
    "google-genai>=2.19.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    #    "pytest-cov"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: test that needs the real model",
    "integration: integration tests",
]
#python_files = ["test_*.py", "*_test.py"]
#python_classes = ["Test*", "*Tests"]
#python_functions = ["test_*"]
